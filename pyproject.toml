[project]
name = "vpn-client"
version = "0.1.0"
description = "Web frontend to start a Wireguard VPN session"
readme = "README.md"
authors = [{ name = "Eamon Mason", email = "eamon.mason@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.33.1",
    "flask>=3.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "bin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into private helpers of the app module.
"tests/*" = ["SLF001"]
